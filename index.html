<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>不等号セレクターゲーム</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .game-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        .level-selector {
            margin-bottom: 30px;
        }
        .level-btn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            margin: 0 10px;
            border-radius: 25px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .level-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        .level-btn.active {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }
        .game-area {
            display: none;
            margin-top: 30px;
        }
        .game-area.active {
            display: block;
        }
        .game-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 1.1em;
            color: #666;
        }
        .problem {
            font-size: 2em;
            margin: 30px 0;
            color: #333;
            font-weight: bold;
        }
        .inequality-buttons {
            margin: 20px 0;
        }
        .inequality-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 25px;
            margin: 0 15px;
            border-radius: 15px;
            font-size: 1.5em;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .inequality-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        .timer {
            font-size: 1.5em;
            font-weight: bold;
            color: #e74c3c;
            margin: 20px 0;
        }
        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 15px;
            font-size: 1.2em;
            font-weight: bold;
        }
        .result.correct {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .result.incorrect {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .final-result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 15px;
            font-size: 1.3em;
            font-weight: bold;
        }
        .final-result.pass {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .final-result.fail {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .start-btn {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        .level-info {
            margin: 20px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            color: #666;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>不等号セレクターゲーム</h1>
        
        <div class="level-selector">
            <button class="level-btn active" onclick="selectLevel(3, this)">3級</button>
            <button class="level-btn" onclick="selectLevel(2, this)">2級</button>
            <button class="level-btn" onclick="selectLevel(1, this)">1級</button>
        </div>
        
        <div class="level-info" id="levelInfo">
            <strong>3級:</strong> 分数・小数の問題 (10問中8問正解で合格)
        </div>
        
        <div class="game-area active" id="gameArea">
            <div class="game-info">
                <span>問題 <span id="currentQuestion">0</span>/<span id="totalQuestions">0</span></span>
                <span>正解数: <span id="correctCount">0</span></span>
            </div>
            
            <div class="timer" id="timer">30秒</div>
            
            <div class="problem" id="problem">
                <button class="start-btn" onclick="startGame()">ゲーム開始</button>
            </div>
            
            <div class="inequality-buttons" id="inequalityButtons" style="display:none;">
                <button class="inequality-btn" onclick="selectAnswer('<')">&lt;</button>
                <button class="inequality-btn" onclick="selectAnswer('>')">></button>
            </div>
            
            <div class="result" id="result"></div>
            <div class="final-result" id="finalResult"></div>
        </div>
    </div>

    <script>
        let currentLevel = 3;
        let currentQuestion = 0;
        let correctCount = 0;
        let timeLeft = 30;
        let timer = null;
        let gameActive = false;
        let currentAnswer = '';
        let leftValue = 0;
        let rightValue = 0;

        const levelConfig = {
            3: {
                totalQuestions: 10,
                passThreshold: 8,
                info: '<strong>3級:</strong> 分数・小数の問題 (10問中8問正解で合格)'
            },
            2: {
                totalQuestions: 15,
                passThreshold: 10,
                info: '<strong>2級:</strong> 分数・小数・除算の問題 (15問中10問正解で合格)'
            },
            1: {
                totalQuestions: 20,
                passThreshold: 12,
                info: '<strong>1級:</strong> 分数・除算・三角関数・シグマ・微積分の問題 (20問中12問正解で合格)'
            }
        };

        function selectLevel(level, buttonElement) {
            currentLevel = level;
            document.querySelectorAll('.level-btn').forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');
            document.getElementById('levelInfo').innerHTML = levelConfig[level].info;
            resetGame();
        }

        function resetGame() {
            currentQuestion = 0;
            correctCount = 0;
            timeLeft = 30;
            gameActive = false;
            clearInterval(timer);
            
            document.getElementById('currentQuestion').textContent = currentQuestion;
            document.getElementById('totalQuestions').textContent = levelConfig[currentLevel].totalQuestions;
            document.getElementById('correctCount').textContent = correctCount;
            document.getElementById('timer').textContent = '30秒';
            document.getElementById('problem').innerHTML = '<button class="start-btn" onclick="startGame()">ゲーム開始</button>';
            document.getElementById('inequalityButtons').style.display = 'none';
            document.getElementById('result').innerHTML = '';
            document.getElementById('finalResult').innerHTML = '';
        }

        function startGame() {
            gameActive = true;
            document.getElementById('gameArea').classList.add('active');
            nextQuestion();
        }

        function nextQuestion() {
            if (currentQuestion >= levelConfig[currentLevel].totalQuestions) {
                endGame();
                return;
            }

            currentQuestion++;
            document.getElementById('currentQuestion').textContent = currentQuestion;
            document.getElementById('result').innerHTML = '';
            
            generateProblem();
            startTimer();
            document.getElementById('inequalityButtons').style.display = 'block';
        }

        function generateProblem() {
            let problemText = '';
            
            if (currentLevel === 3) {
                // 3級: 分数・小数から2つ選択
                let types = ['fraction', 'decimal'];
                let leftType = types[Math.floor(Math.random() * types.length)];
                let rightType = types[Math.floor(Math.random() * types.length)];
                
                [leftValue, problemText] = generateValue(leftType, 3, true);
                let rightResult = generateValue(rightType, 3, false);
                rightValue = rightResult[0];
                problemText += ' __ ' + rightResult[1];
                
                // 等しくならないようにする
                let attempts = 0;
                while (Math.abs(leftValue - rightValue) < 0.001 && attempts < 50) {
                    rightResult = generateValue(rightType, 3, false);
                    rightValue = rightResult[0];
                    attempts++;
                }
                if (attempts >= 50) {
                    rightValue = leftValue + (Math.random() > 0.5 ? 0.1 : -0.1);
                    rightResult[1] = rightValue.toFixed(2);
                }
                problemText = problemText.split(' __ ')[0] + ' __ ' + rightResult[1];
                
            } else if (currentLevel === 2) {
                // 2級: 分数・小数・除算から2つ選択、差0.1未満
                let types = ['fraction2', 'decimal2', 'division'];
                let leftType = types[Math.floor(Math.random() * types.length)];
                let rightType = types[Math.floor(Math.random() * types.length)];
                
                [leftValue, problemText] = generateValue(leftType, 2, true);
                let rightResult = generateValue(rightType, 2, false);
                rightValue = rightResult[0];
                problemText += ' __ ' + rightResult[1];
                
                // 差が0.1未満で、かつ等しくならないように調整
                let attempts = 0;
                while ((Math.abs(leftValue - rightValue) >= 0.1 || Math.abs(leftValue - rightValue) < 0.001) && attempts < 100) {
                    rightResult = generateValue(rightType, 2, false);
                    rightValue = rightResult[0];
                    attempts++;
                }
                if (attempts >= 100) {
                    // 強制的に差を0.1未満かつ等しくならないようにする
                    let diff = (Math.random() * 0.09) + 0.01;
                    rightValue = leftValue + (Math.random() > 0.5 ? diff : -diff);
                    if (rightType === 'fraction2') {
                        rightResult[1] = Math.floor(rightValue * 100) + '/100';
                    } else if (rightType === 'decimal2') {
                        rightResult[1] = rightValue.toFixed(3);
                    } else {
                        rightResult[1] = Math.floor(rightValue * 1000) + '÷1000';
                    }
                }
                problemText = problemText.split(' __ ')[0] + ' __ ' + rightResult[1];
                
            } else if (currentLevel === 1) {
                // 1級: 5つの系統から2つ選択、差0.02未満
                let types = ['fraction1', 'division1'];
                if (currentQuestion >= 10) types.push('trigonometry');
                if (currentQuestion >= 12) types.push('sigma');
                if (currentQuestion >= 15) types.push('calculus');
                
                let leftType = types[Math.floor(Math.random() * types.length)];
                let rightType = types[Math.floor(Math.random() * types.length)];
                
                [leftValue, problemText] = generateValue(leftType, 1, true);
                let rightResult = generateValue(rightType, 1, false);
                rightValue = rightResult[0];
                problemText += ' __ ' + rightResult[1];
                
                // 差が0.02未満で、かつ等しくならないように調整
                let attempts = 0;
                while ((Math.abs(leftValue - rightValue) >= 0.02 || Math.abs(leftValue - rightValue) < 0.0001) && attempts < 100) {
                    rightResult = generateValue(rightType, 1, false);
                    rightValue = rightResult[0];
                    attempts++;
                }
                if (attempts >= 100) {
                    // 強制的に差を0.02未満かつ等しくならないようにする
                    let diff = (Math.random() * 0.018) + 0.001;
                    rightValue = leftValue + (Math.random() > 0.5 ? diff : -diff);
                    if (rightType === 'fraction1') {
                        rightResult[1] = Math.floor(rightValue * 100) + '/100';
                    } else if (rightType === 'division1') {
                        rightResult[1] = Math.floor(rightValue * 1000) + '÷1000';
                    } else {
                        rightResult[1] = rightValue.toFixed(4);
                    }
                }
                problemText = problemText.split(' __ ')[0] + ' __ ' + rightResult[1];
            }
            
            // 答えの決定
            if (leftValue < rightValue) {
                currentAnswer = '<';
            } else if (leftValue > rightValue) {
                currentAnswer = '>';
            } else {
                currentAnswer = '<'; // 万が一等しくなった場合のフォールバック
            }
            
            document.getElementById('problem').innerHTML = problemText;
        }

        function generateValue(type, level, isLeft) {
            let value, text;
            
            if (type === 'fraction') {
                // 3級分数
                let num = Math.floor(Math.random() * 19) + 1;
                let den = Math.floor(Math.random() * 19) + 1;
                value = num / den;
                text = `${num}/${den}`;
            } else if (type === 'decimal') {
                // 3級小数
                value = Math.round((Math.random() * 2.99) * 100) / 100;
                text = value.toFixed(2);
            } else if (type === 'fraction2') {
                // 2級分数
                let num = Math.floor(Math.random() * 90) + 10;
                let den = Math.floor(Math.random() * 199) + 100;
                value = num / den;
                text = `${num}/${den}`;
            } else if (type === 'decimal2') {
                // 2級小数
                value = Math.round((Math.random() * 0.999) * 1000) / 1000;
                text = value.toFixed(3);
            } else if (type === 'division') {
                // 2級除算
                let num1 = Math.floor(Math.random() * 90) + 10;
                let den1 = Math.floor(Math.random() * 900) + 100;
                value = num1 / den1;
                text = `${num1}÷${den1}`;
            } else if (type === 'fraction1') {
                // 1級分数
                let num = Math.floor(Math.random() * 400) + 500;
                let den = Math.floor(Math.random() * 90) + 10;
                value = num / den;
                text = `${num}/${den}`;
            } else if (type === 'division1') {
                // 1級除算
                let num1 = Math.floor(Math.random() * 900) + 100;
                let den1 = Math.floor(Math.random() * 90) + 10;
                value = num1 / den1;
                text = `${num1}÷${den1}`;
            } else if (type === 'trigonometry') {
                // 1級三角関数
                let angle = Math.floor(Math.random() * 90) + 1;
                let func = Math.random() < 0.5 ? 'sin' : 'cos';
                value = func === 'sin' ? Math.sin(angle * Math.PI / 180) : Math.cos(angle * Math.PI / 180);
                text = `${func}(${angle}°)`;
            } else if (type === 'sigma') {
                // 1級シグマ（複雑化）
                let n = Math.floor(Math.random() * 3) + 3;
                let sigmaType = Math.floor(Math.random() * 4);
                
                if (sigmaType === 0) {
                    // Σ(i²) = n(n+1)(2n+1)/6
                    value = n * (n + 1) * (2 * n + 1) / 6;
                    text = `Σ(i=1 to ${n})i²`;
                } else if (sigmaType === 1) {
                    // Σ(i³) = [n(n+1)/2]²
                    value = Math.pow(n * (n + 1) / 2, 2);
                    text = `Σ(i=1 to ${n})i³`;
                } else if (sigmaType === 2) {
                    // Σ(1/i) の近似（調和数列）
                    value = 0;
                    for (let i = 1; i <= n; i++) {
                        value += 1 / i;
                    }
                    text = `Σ(i=1 to ${n})(1/i)`;
                } else {
                    // Σ(sin(iπ/n))
                    value = 0;
                    for (let i = 1; i <= n; i++) {
                        value += Math.sin(i * Math.PI / n);
                    }
                    text = `Σ(i=1 to ${n})sin(iπ/${n})`;
                }
            } else if (type === 'calculus') {
                // 1級微積分（複雑化）
                let calcType = Math.floor(Math.random() * 4);
                let a = Math.floor(Math.random() * 4) + 1;
                
                if (calcType === 0) {
                    // ∫x²dx = x³/3
                    value = Math.pow(a, 3) / 3;
                    text = `∫(0 to ${a})x²dx`;
                } else if (calcType === 1) {
                    // ∫sin(x)dx = -cos(x) (xはラジアン)
                    value = -Math.cos(a) + 1;
                    text = `∫(0 to ${a})sin(x)dx`;
                } else if (calcType === 2) {
                    // ∫1/x dx = ln(x) from 1 to a
                    value = Math.log(a);
                    text = `∫(1 to ${a})1/x dx`;
                } else {
                    // d/dx(x³) at x=a = 3a²
                    value = 3 * a * a;
                    text = `d/dx(x³)|x=${a}`;
                }
            }
            
            return [value, text];
        }

        function startTimer() {
            timeLeft = 30;
            document.getElementById('timer').textContent = timeLeft + '秒';
            
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').textContent = timeLeft + '秒';
                
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    showResult(false, '時間切れ！');
                }
            }, 1000);
        }

        function selectAnswer(answer) {
            if (!gameActive) return;
            
            clearInterval(timer);
            
            if (answer === currentAnswer) {
                correctCount++;
                document.getElementById('correctCount').textContent = correctCount;
                showResult(true, '正解！');
            } else {
                showResult(false, `不正解！正解は "${currentAnswer}" でした。`);
            }
        }

        function showResult(isCorrect, message) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = message;
            resultDiv.className = 'result ' + (isCorrect ? 'correct' : 'incorrect');
            
            setTimeout(() => {
                nextQuestion();
            }, 2000);
        }

        function endGame() {
            gameActive = false;
            clearInterval(timer);
            
            const config = levelConfig[currentLevel];
            const passed = correctCount >= config.passThreshold;
            
            const finalResultDiv = document.getElementById('finalResult');
            finalResultDiv.innerHTML = `
                <h3>ゲーム終了！</h3>
                <p>${config.totalQuestions}問中${correctCount}問正解</p>
                <p><strong>${passed ? '合格！' : '不合格'}</strong></p>
                <p>合格ライン: ${config.passThreshold}問</p>
                <button class="start-btn" onclick="resetGame()">もう一度挑戦</button>
            `;
            finalResultDiv.className = 'final-result ' + (passed ? 'pass' : 'fail');
            
            document.getElementById('problem').innerHTML = '';
            document.getElementById('inequalityButtons').style.display = 'none';
            document.getElementById('timer').textContent = '';
        }

        // 初期化
        resetGame();
    </script>
</body>
</html>
